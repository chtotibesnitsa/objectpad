    <meta property="og:url" content="https://objectpad.fun/" />
    <meta property="og:image" content="https://objectpad.fun/og-objectpad-banner.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preload" href="/fonts/anybody.ttf" as="font" type="font/ttf" crossorigin />

  </head>
  <body>
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F2F3F5; color: #0C0D10; font-family: Arial, Helvetica, sans-serif; }
      #boot .mark { width: 48px; height: 48px; background: url(/brand/duck-mark-192.png) center/contain no-repeat; animation: boot-pulse 1.4s ease-in-out infinite alternate; }
      #boot .word { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
      #boot .hint { font: 500 10px ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: #5E6068; }
      @keyframes boot-pulse { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1.03); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none; } }
    </style>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="mark" aria-hidden="true"></div>
        <div class="word">ObjectPad</div>
        <div class="hint">Loading the scanner</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
